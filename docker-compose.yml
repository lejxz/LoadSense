version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    depends_on:
      - backend

  commuter-app:
    build: ./commuter-app
    ports:
      - "5174:5174"
    depends_on:
      - backend
